<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Forgot Password — SkillScape</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="auth.css" />
</head>
<body data-auth="forgot-password">
  <div class="auth-shell">
    <main class="auth-card">
      <header class="auth-header">
        <a href="landing.html" class="brand-link">
          <div class="brand-mark">SS</div>
        </a>
        <div>
          <h2 class="auth-title">Forgot Password?</h2>
          <div class="auth-sub">No worries — we'll send you reset instructions.</div>
        </div>
      </header>

      <form id="auth-form" class="auth-form" novalidate>
        <div id="status-message" class="status-message" style="display:none" role="alert"></div>

        <div class="form-group">
          <label for="email" class="form-label">Email Address</label>
          <div class="input-wrapper">
            <svg class="input-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
              <polyline points="22,6 12,13 2,6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            <input type="email" id="email" name="email" class="form-input" placeholder="you@example.com" required autocomplete="email" />
          </div>
        </div>

        <button type="submit" class="auth-submit btn btn-primary">
          Send Reset Link
        </button>
      </form>

      <div class="auth-footer">
        <p>Remember your password? <a href="signin.html" class="link">Sign in</a></p>
        <p>Don't have an account? <a href="signup.html" class="link">Sign up</a></p>
      </div>
    </main>
  </div>

  <script>
    const BACKEND_URL = 'http://127.0.0.1:8084';

    const form = document.getElementById('auth-form');
    const statusMessage = document.getElementById('status-message');
    const submitBtn = document.querySelector('.auth-submit');
    const emailInput = document.getElementById('email');

    function showStatus(message, type = 'success') {
      statusMessage.textContent = message;
      statusMessage.className = `status-message ${type}`;
      statusMessage.style.display = 'block';
    }

    function hideStatus() {
      statusMessage.style.display = 'none';
    }

    function validateEmail(email) {
      return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
    }

    async function requestPasswordReset(email) {
      const response = await fetch(`${BACKEND_URL}/auth/forgot-password`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email }),
      });
      const result = await response.json().catch(() => ({}));
      if (!response.ok) {
        throw new Error(result.detail || result.message || 'Failed to send reset email.');
      }
      return result;
    }

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      hideStatus();

      const email = emailInput.value.trim().toLowerCase();

      if (!email) {
        showStatus('Please enter your email address.', 'error');
        return;
      }

      if (!validateEmail(email)) {
        showStatus('Please enter a valid email address.', 'error');
        return;
      }

      submitBtn.disabled = true;
      submitBtn.textContent = 'Sending...';

      try {
        await requestPasswordReset(email);
        showStatus('If an account exists with that email, you will receive reset instructions shortly.', 'success');
        form.reset();
        submitBtn.style.display = 'none';
      } catch (error) {
        showStatus(error.message, 'error');
        submitBtn.disabled = false;
        submitBtn.textContent = 'Send Reset Link';
      }
    });
  </script>
</body>
</html>
