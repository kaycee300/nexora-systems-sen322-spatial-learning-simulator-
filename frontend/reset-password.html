<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reset Password — SkillScape</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="auth.css" />
</head>
<body data-auth="reset-password">
  <div class="auth-shell">
    <main class="auth-card">
      <header class="auth-header">
        <a href="landing.html" class="brand-link">
          <div class="brand-mark">SS</div>
        </a>
        <div>
          <h2 class="auth-title">Set New Password</h2>
          <div class="auth-sub">Create a strong password for your account.</div>
        </div>
      </header>

      <form id="auth-form" class="auth-form" novalidate>
        <div id="status-message" class="status-message" style="display:none" role="alert"></div>

        <div class="form-group">
          <label for="password" class="form-label">New Password</label>
          <div class="password-input-wrapper">
            <svg class="input-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
              <rect x="3" y="11" width="18" height="11" rx="2" ry="2" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
              <path d="M7 11V7a5 5 0 0 1 10 0v4" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            <input type="password" id="password" name="password" class="form-input" placeholder="Enter new password" required minlength="6" autocomplete="new-password" />
            <button type="button" class="password-toggle" data-visible="false" aria-label="Show password">
              <svg class="eye-open" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                <circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
              <svg class="eye-closed" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" style="display:none">
                <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                <line x1="1" y1="1" x2="23" y2="23" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </button>
          </div>
          <div class="password-requirements">
            <span id="password-length" class="requirement">At least 6 characters</span>
          </div>
        </div>

        <div class="form-group">
          <label for="confirm_password" class="form-label">Confirm Password</label>
          <div class="password-input-wrapper">
            <svg class="input-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
              <rect x="3" y="11" width="18" height="11" rx="2" ry="2" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
              <path d="M7 11V7a5 5 0 0 1 10 0v4" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            <input type="password" id="confirm_password" name="confirm_password" class="form-input" placeholder="Confirm new password" required autocomplete="new-password" />
            <button type="button" class="password-toggle" data-visible="false" aria-label="Show password">
              <svg class="eye-open" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                <circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
              <svg class="eye-closed" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" style="display:none">
                <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                <line x1="1" y1="1" x2="23" y2="23" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </button>
          </div>
        </div>

        <button type="submit" class="auth-submit btn btn-primary">
          Reset Password
        </button>
      </form>

      <div class="auth-footer">
        <p>Remember your password? <a href="signin.html" class="link">Sign in</a></p>
      </div>
    </main>
  </div>

  <script>
    const BACKEND_URL = 'http://127.0.0.1:8084';

    // Get token from URL
    const urlParams = new URLSearchParams(window.location.search);
    const resetToken = urlParams.get('token');

    const form = document.getElementById('auth-form');
    const statusMessage = document.getElementById('status-message');
    const submitBtn = document.querySelector('.auth-submit');
    const passwordInput = document.getElementById('password');
    const confirmPasswordInput = document.getElementById('confirm_password');
    const passwordLengthReq = document.getElementById('password-length');

    // Check if token exists
    if (!resetToken) {
      showStatus('Invalid reset link. Please request a new password reset.', 'error');
      submitBtn.disabled = true;
    }

    function showStatus(message, type = 'success') {
      statusMessage.textContent = message;
      statusMessage.className = `status-message ${type}`;
      statusMessage.style.display = 'block';
    }

    function hideStatus() {
      statusMessage.style.display = 'none';
    }

    function validatePassword(password) {
      return password.length >= 6;
    }

    // Password visibility toggle
    function setupPasswordToggle(toggleBtn) {
      const input = toggleBtn.closest('.password-input-wrapper').querySelector('input');
      const eyeOpen = toggleBtn.querySelector('.eye-open');
      const eyeClosed = toggleBtn.querySelector('.eye-closed');

      toggleBtn.addEventListener('click', () => {
        const isVisible = toggleBtn.dataset.visible === 'true';
        const newState = !isVisible;

        input.type = newState ? 'text' : 'password';
        toggleBtn.dataset.visible = newState.toString();

        if (eyeOpen && eyeClosed) {
          eyeOpen.style.display = newState ? 'none' : 'block';
          eyeClosed.style.display = newState ? 'block' : 'none';
        }

        toggleBtn.setAttribute('aria-label', newState ? 'Hide password' : 'Show password');
      });
    }

    document.querySelectorAll('.password-toggle').forEach(setupPasswordToggle);

    // Real-time password validation
    passwordInput.addEventListener('input', () => {
      const isValid = validatePassword(passwordInput.value);
      passwordLengthReq.style.color = isValid ? '#10b981' : '#ef4444';
    });

    async function resetPassword(token, newPassword) {
      const response = await fetch(`${BACKEND_URL}/auth/reset-password`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ token, new_password: newPassword }),
      });
      const result = await response.json().catch(() => ({}));
      if (!response.ok) {
        throw new Error(result.detail || result.message || 'Failed to reset password.');
      }
      return result;
    }

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      hideStatus();

      const password = passwordInput.value;
      const confirmPassword = confirmPasswordInput.value;

      // Validate
      if (!password || !confirmPassword) {
        showStatus('Please fill in all fields.', 'error');
        return;
      }

      if (!validatePassword(password)) {
        showStatus('Password must be at least 6 characters long.', 'error');
        return;
      }

      if (password !== confirmPassword) {
        showStatus('Passwords do not match.', 'error');
        return;
      }

      submitBtn.disabled = true;
      submitBtn.textContent = 'Resetting...';

      try {
        await resetPassword(resetToken, password);
        showStatus('Password reset successfully! Redirecting to sign in...', 'success');
        form.style.display = 'none';
        setTimeout(() => {
          window.location.href = 'signin.html';
        }, 2000);
      } catch (error) {
        showStatus(error.message, 'error');
        submitBtn.disabled = false;
        submitBtn.textContent = 'Reset Password';
      }
    });
  </script>
</body>
</html>
