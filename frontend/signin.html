<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign In – SkillScape</title>
  <link rel="stylesheet" href="landing.css" />
</head>
<body class="auth-page" data-auth="signin">
  <main class="auth-card">
    <div class="auth-hero">
      <div class="auth-icon auth-icon-signin">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>
      <div>
        <h1>Welcome back</h1>
      </div>
    </div>

    <div id="status-message" class="status-message" style="display:none;"></div>

    <form id="auth-form" class="auth-form">
      <div class="oauth-group">
        <a class="btn btn-google" href="#" id="google-signin">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M21.35 11.1h-9.2v2.9h5.3c-.23 1.45-1.32 3.45-4.1 3.45-2.47 0-4.48-2.03-4.48-4.53s2.01-4.53 4.48-4.53c1.4 0 2.33.6 2.87 1.12l2-.95C17.9 6.01 15.98 5 13.73 5 9.96 5 7 8 7 11.8S9.96 18.6 13.73 18.6c4.03 0 6.83-2.83 6.83-6.85 0-.46-.05-.82-.2-1.05z" fill="currentColor"/>
          </svg>
          Continue with Google
        </a>
      </div>
      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" placeholder="you@example.com" required />
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" placeholder="Enter your password" required />
      </div>

      <button type="submit" class="btn btn-primary auth-submit">Sign In</button>
    </form>

    <div class="auth-footer">
      <span>New to SkillScape?</span>
      <a href="signup.html">Sign Up</a>
    </div>
  </main>

  <script src="auth.js"></script>
</body>
</html>
