<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign Up – SkillScape</title>
  <link rel="stylesheet" href="auth.css" />
</head>
<body class="auth-page" data-auth="signup">
  <div class="auth-shell">
    <main class="auth-card">
      <header class="auth-header">
        <div class="brand-mark">SS</div>
        <div>
          <h2 class="auth-title">Create your SkillScape account</h2>
          <div class="auth-sub">Join SkillScape to track skills, courses and progress.</div>
        </div>
      </header>

      <div id="status-message" class="status-message" style="display:none;"></div>

      <form id="auth-form" class="auth-form">
      <div class="oauth-group">
        <a class="btn btn-google" href="#" id="google-signup">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M21.35 11.1h-9.2v2.9h5.3c-.23 1.45-1.32 3.45-4.1 3.45-2.47 0-4.48-2.03-4.48-4.53s2.01-4.53 4.48-4.53c1.4 0 2.33.6 2.87 1.12l2-.95C17.9 6.01 15.98 5 13.73 5 9.96 5 7 8 7 11.8S9.96 18.6 13.73 18.6c4.03 0 6.83-2.83 6.83-6.85 0-.46-.05-.82-.2-1.05z" fill="currentColor"/>
          </svg>
          Continue with Google
        </a>
      </div>
      <div class="form-group">
        <label for="name">Full Name</label>
        <input type="text" id="name" name="name" placeholder="Jane Doe" required />
      </div>

      <div class="form-group email-verification-group">
        <label for="email">Email</label>
        <div class="email-inline">
          <input type="email" id="email" name="email" placeholder="you@example.com" required />
          <button type="button" class="btn" id="send-code-btn">Send code</button>
        </div>
        <div id="code-section" style="display:none; margin-top:8px;">
          <input type="text" id="code-input" name="code" placeholder="Enter verification code" />
          <button type="button" class="btn" id="verify-code-btn">Verify</button>
        </div>
        <div id="email-verified" style="display:none;color:var(--accent);margin-top:6px;">Email verified ✓</div>
      </div>

      <div class="form-row">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" placeholder="At least 6 characters" required />
      </div>

      <div class="form-row">
        <label for="confirm-password">Confirm Password</label>
        <input type="password" id="confirm-password" name="confirm_password" placeholder="Re-enter password" required />
      </div>

      <div class="form-row terms">
        <label class="muted"><input type="checkbox" id="terms" name="terms" required /> I agree to the Terms and Privacy Policy</label>
      </div>

      <button type="submit" class="btn primary auth-submit">Create Account</button>
    </form>
    <div class="footnote">
      <span class="muted">Already have an account?</span>
      <a href="signin.html">Sign In</a>
    </div>
    </main>
  </div>

  <script src="auth.js"></script>
</body>
</html>
