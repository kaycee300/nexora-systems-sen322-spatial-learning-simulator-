<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Workshop — SkillScape</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="app.css" />
  <style>
    body { overflow: hidden; }
    .sim-shell { display: flex; height: 100vh; }

    .sim-stage {
      flex: 1; position: relative; background:
        radial-gradient(circle at 30% 20%, rgba(15,118,110,0.15), transparent 60%),
        radial-gradient(circle at 75% 75%, rgba(6,182,212,0.12), transparent 55%),
        #0b1220;
      overflow: hidden;
    }
    .sim-stage canvas { display: block; width: 100%; height: 100%; }

    .sim-topbar {
      position: absolute; top: 0; left: 0; right: 0;
      display: flex; align-items: center; justify-content: space-between;
      padding: 18px 24px; z-index: 5;
      background: linear-gradient(180deg, rgba(11,18,32,0.8), transparent);
    }
    .sim-topbar h1 { color: #fff; font-size: 1.15rem; }
    .sim-topbar .back { color: #94a3b8; font-size: 0.85rem; display: flex; align-items: center; gap: 8px; }
    .sim-topbar .back:hover { color: #5eead4; text-decoration: none; }

    .sim-hud {
      position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%);
      background: rgba(15,23,42,0.9); backdrop-filter: blur(10px);
      border: 1px solid rgba(94,234,212,0.25); border-radius: 14px;
      color: #fff; padding: 10px 18px; font-size: 0.8rem; z-index: 5;
      display: flex; gap: 16px; align-items: center;
      box-shadow: 0 10px 30px rgba(0,0,0,0.4);
    }
    .sim-hud .hud-item { text-align: center; }
    .sim-hud .hud-label { color: #64748b; font-size: 0.62rem; text-transform: uppercase; letter-spacing: 0.08em; }
    .sim-hud .hud-value { font-family: var(--font-display); font-weight: 700; font-size: 1.05rem; }
    .sim-hud .hud-value.green { color: #5eead4; }
    .sim-hud .hud-value.gold { color: #fcd34d; }

    .sim-panel {
      width: 340px; background: #fff; display: flex; flex-direction: column;
      border-right: 1px solid var(--border);
    }
    .sim-panel-head { padding: 20px; border-bottom: 1px solid var(--border); }
    .sim-panel-head h2 { font-size: 1.1rem; margin-bottom: 4px; }
    .sim-panel-head p { font-size: 0.82rem; color: var(--text-muted); }

    .task-list { flex: 1; overflow-y: auto; padding: 12px 20px; }
    .task {
      display: flex; align-items: flex-start; gap: 12px; padding: 12px 0;
      border-bottom: 1px solid var(--border); font-size: 0.88rem;
    }
    .task:last-child { border-bottom: none; }
    .task .check {
      width: 22px; height: 22px; border-radius: 50%; flex-shrink: 0;
      border: 2px solid var(--border-strong); display: grid; place-items: center;
      color: #fff; font-size: 0.7rem; margin-top: 1px;
      transition: all 0.2s ease;
    }
    .task.done .check { background: var(--primary); border-color: var(--primary); }
    .task .t-title { font-weight: 600; }
    .task .t-desc { color: var(--text-muted); font-size: 0.78rem; }
    .task.done .t-title { color: var(--text-muted); text-decoration: line-through; }

    .sim-actions { padding: 16px 20px 20px; border-top: 1px solid var(--border); display: flex; flex-direction: column; gap: 10px; }
    .sim-actions .btn { justify-content: center; width: 100%; }

    .mode-hint {
      position: absolute; top: 70px; left: 50%; transform: translateX(-50%);
      background: rgba(15,23,42,0.85); color: #99f6e4;
      padding: 8px 18px; border-radius: 999px; font-size: 0.8rem;
      border: 1px solid rgba(94,234,212,0.3); z-index: 5;
      opacity: 0; transition: opacity 0.3s ease; pointer-events: none; white-space: nowrap;
    }
    .mode-hint.show { opacity: 1; }

    .coach-box {
      background: linear-gradient(135deg, rgba(15,118,110,0.08), rgba(6,182,212,0.1));
      border: 1px dashed var(--primary-light);
      border-radius: 12px; padding: 14px 16px;
    }
    .coach-msg { font-size: 0.85rem; color: var(--text); line-height: 1.5; }
    .coach-msg b { color: var(--primary); }
    .coach-tag { display: inline-block; background: var(--primary); color: #fff; font-size: 0.65rem; font-weight: 700; padding: 2px 8px; border-radius: 999px; margin-bottom: 6px; }

    @media (max-width: 760px) {
      .sim-shell { flex-direction: column; }
      .sim-panel { width: 100%; height: 45vh; border-right: none; border-top: 1px solid var(--border); }
      .sim-stage { height: 55vh; }
    }
  </style>
</head>
<body>
  <div class="sim-shell">
    <div class="sim-panel">
      <div class="sim-panel-head">
        <h2 id="simName">Workshop</h2>
        <p><span id="coachStatus"></span><span id="simDesc"></span></p>
        <div style="display:flex;gap:8px;margin-top:10px">
          <button class="btn secondary" id="coachBtn" style="flex:1">🤖 AI Coach</button>
        </div>
      </div>

      <div class="coach-box" id="coachBox" style="display:none;margin:0 20px;margin-top:14px">
        <div class="coach-msg" id="coachMsg"></div>
      </div>

      <div class="task-list" id="taskList"></div>

      <div class="sim-actions">
        <button class="btn primary" id="assessBtn" disabled>Submit Assessment</button>
        <button class="btn secondary" id="resetBtn">Reset session</button>
      </div>
    </div>

    <div class="sim-stage" id="stage">
      <div class="sim-topbar">
        <a class="back" href="catalog.html">← Back to catalog</a>
        <h1 id="simTitle">🔧 Workshop</h1>
        <div style="width:120px"></div>
      </div>
      <div class="mode-hint" id="modeHint"></div>
      <div class="sim-hud">
        <div class="hud-item"><div class="hud-label">Progress</div><div class="hud-value green" id="hudProgress">0/0</div></div>
        <div class="hud-item"><div class="hud-label">Moves</div><div class="hud-value" id="hudMoves">0</div></div>
        <div class="hud-item"><div class="hud-label">Score</div><div class="hud-value gold" id="hudScore">0</div></div>
        <div class="hud-item"><div class="hud-label">Mode</div><div class="hud-value" id="hudMode">Ready</div></div>
      </div>
      <canvas id="simCanvas"></canvas>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="sim-core.js"></script>
  <script>
    const type = new URLSearchParams(window.location.search).get('type') || 'robotics';
    const loader = document.createElement('script');
    loader.src = `sim-${type}.js`;
    loader.onerror = () => { document.body.innerHTML = '<div style="padding:40px;font-family:system-ui">Unknown simulation type: <b>' + type + '</b></div>'; };
    loader.onload = () => {
      const cfg = SimCore.modules[type];
      if (cfg) SimCore.start(cfg); else document.body.innerHTML = '<div style="padding:40px;font-family:system-ui">Simulation module not found: <b>' + type + '</b></div>';
    };
    document.head.appendChild(loader);
  </script>
</body>
</html>
