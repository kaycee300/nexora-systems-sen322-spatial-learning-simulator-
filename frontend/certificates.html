<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Certificates — SkillScape</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&family=Playfair+Display:wght@600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="app.css" />
  <style>
    .cert-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(380px, 1fr)); gap: 24px; }
    .cert {
      background: #fff; border: 1px solid var(--border); border-radius: var(--radius-lg);
      overflow: hidden; box-shadow: var(--shadow-sm); position: relative;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      perspective: 1000px;
    }
    .cert:hover { transform: translateY(-4px); box-shadow: var(--shadow-lg); }
    .cert-inner { padding: 28px; transform-style: preserve-3d; }
    .cert::before {
      content: ''; position: absolute; inset: 0;
      padding: 18px; border-radius: var(--radius-lg);
      background: linear-gradient(135deg, rgba(15,118,110,0.5), rgba(6,182,212,0.5));
      -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      -webkit-mask-composite: xor; mask-composite: exclude;
      pointer-events: none;
    }
    .cert-icon { width: 56px; height: 56px; border-radius: 50%; background: linear-gradient(135deg, var(--primary), var(--cyan)); display: grid; place-items: center; color: #fff; margin-bottom: 14px; box-shadow: var(--shadow-brand); }
    .cert-icon svg { width: 30px; height: 30px; }
    .cert h2 { font-size: 1.25rem; margin-bottom: 4px; }
    .cert .cert-meta { font-family: 'Playfair Display', serif; font-size: 1rem; color: var(--text-muted); margin-bottom: 14px; }
    .cert .awarded { font-size: 0.75rem; color: var(--text-muted); margin-bottom: 18px; }
    .cert .awarded strong { color: var(--text); font-weight: 700; }
    .cert-footer { display: flex; justify-content: space-between; align-items: center; border-top: 1px solid var(--border); padding-top: 14px; }
    .cert-footer .seal { font-family: var(--font-display); font-size: 0.68rem; letter-spacing: 0.08em; color: var(--primary); text-transform: uppercase; display: flex; align-items: center; gap: 6px; }
    .cert-footer .verify { font-size: 0.7rem; color: var(--text-muted); }
    body[data-theme="dark"] .cert { background: var(--bg-card); }
    body[data-theme="dark"] .cert .awarded strong { color: var(--text); }
    .cert-actions { display: flex; gap: 10px; margin-top: 12px; }
  </style>
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-brand">
        <div class="brand-mark">SS</div>
        <div class="brand-copy">
          <strong>SkillScape</strong>
          <span>Where practice meets simulation</span>
        </div>
      </div>
      <nav class="sidebar-nav">
        <div class="nav-section">Learn</div>
        <a class="nav-link" href="dashboard.html">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="9"/><rect x="14" y="3" width="7" height="5"/><rect x="14" y="12" width="7" height="9"/><rect x="3" y="16" width="7" height="5"/></svg>
          Overview
        </a>
        <a class="nav-link" href="catalog.html">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
          Courses
        </a>
        <a class="nav-link" href="skillpath.html">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 19V5"/><path d="M5 12l7-7 7 7"/><path d="M5 19h14"/></svg>
          Skill Path
        </a>
        <div class="nav-section">Practice</div>
        <a class="nav-link" href="simulation.html">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 21h8M12 17v4"/></svg>
          Simulations
        </a>
        <a class="nav-link" href="dashboard.html#assessment">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>
          Assessments
        </a>
        <div class="nav-section">Account</div>
        <a class="nav-link active" href="certificates.html">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="6"/><path d="M15.48 12.52 17 22l-5-3-5 3 1.52-9.48"/></svg>
          Certificates
        </a>
        <a class="nav-link" href="dashboard.html#settings">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
          Settings
        </a>
      </nav>
      <div class="sidebar-footer">
        <div class="sidebar-user">
          <div class="avatar" id="userAvatar">?</div>
          <div class="user-meta">
            <strong id="userName">Loading…</strong>
            <span id="userEmail">—</span>
          </div>
        </div>
      </div>
    </aside>

    <div class="main-area">
      <header class="topbar">
        <div style="display:flex;align-items:center;gap:12px">
          <button class="icon-btn menu-toggle" id="menuToggle" aria-label="Toggle menu">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
          </button>
          <span class="topbar-title">Certificates</span>
        </div>
        <div class="topbar-actions">
          <button class="icon-btn" id="themeToggle" aria-label="Toggle theme">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>
          </button>
          <button class="icon-btn" id="notifBtn" aria-label="Notifications">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
          </button>
          <button class="icon-btn" id="signout" aria-label="Sign out">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
          </button>
        </div>
      </header>

      <main class="content">
        <div class="section-row">
          <div>
            <h2>Your certificates</h2>
            <p style="color:var(--text-muted);font-size:0.9rem">Verified achievements from completed simulations and assessments.</p>
          </div>
        </div>
        <div class="cert-grid" id="certGrid"></div>
      </main>
    </div>
  </div>

  <div class="toast-wrap" id="toastWrap"></div>

  <script>
    const CERTS = [
      { title: 'Circuit Wiring Fundamentals', meta: 'Practical assessment · Score 91%', date: 'August 2026', icon: '⚡' },
      { title: 'Multimeter Mastery', meta: 'Basic proficiency badge', date: 'July 2026', icon: '📟' },
      { title: 'Voltage Measurement', meta: 'Practical assessment · Score 88%', date: 'June 2026', icon: '🔌' },
    ];

    const grid = document.getElementById('certGrid');
    const user = (function(){ try { return JSON.parse(localStorage.getItem('skillscape-user')||'null'); } catch(e){ return null; } })();
    const fullName = (user && (user.name || user.email)) || 'SkillScape Learner';

    function certHtml(c) {
      const code = ('SS-' + c.title.replace(/[^a-z0-9]+/gi,'-').slice(0,12) + '-' + Math.random().toString(36).slice(2,8)).toUpperCase();
      return `
      <div class="cert">
        <div class="cert-inner">
          <div class="cert-icon">${c.icon}</div>
          <h2>${c.title}</h2>
          <div class="cert-meta">${c.meta}</div>
          <div class="awarded">This certifies that <strong>${fullName}</strong> completed this SkillScape course and demonstrated the required competencies on ${c.date}.</div>
          <div class="cert-footer">
            <span class="seal">◉ Certified SkillScape</span>
            <span class="verify">ID: ${code}</span>
          </div>
          <div class="cert-actions">
            <button class="btn primary" data-title="${c.title}">Share</button>
            <button class="btn secondary" data-title="${c.title}">View details</button>
          </div>
        </div>
      </div>`;
    }

    grid.innerHTML = CERTS.map(certHtml).join('');

    grid.addEventListener('click', (e) => {
      const btn = e.target.closest('button[data-title]');
      if (!btn) return;
      const wrap = document.getElementById('toastWrap');
      if (wrap) {
        const toast = document.createElement('div');
        toast.className = 'toast success';
        toast.textContent = btn.textContent === 'Share'
          ? `Certificate link copied for "${btn.dataset.title}".`
          : `Opening details for "${btn.dataset.title}"…`;
        wrap.appendChild(toast);
        setTimeout(() => toast.remove(), 4000);
      }
      if (btn.textContent === 'Share') {
        const title = btn.dataset.title;
        try { navigator.clipboard.writeText(`${location.origin}/certificates.html?cert=${encodeURIComponent(title)}`); } catch (err) {}
      }
    });
  </script>
  <script src="app.js"></script>
</body>
</html>
